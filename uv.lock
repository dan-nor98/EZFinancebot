version = 1
revision = 3
requires-python = ">=3.12"

[[package]]
name = "ezfinancebot"
version = "0.1.0"
source = { editable = "." }
dependencies = [
 { name = "alembic" }, { name = "fastapi" }, { name = "httpx" }, { name = "jdatetime" },
 { name = "pydantic-settings" }, { name = "psycopg", extra = ["binary"] },
 { name = "python-json-logger" }, { name = "sqlalchemy" }, { name = "uvicorn" },
]

[package.dev-dependencies]
dev = [{ name = "mypy" }, { name = "pytest" }, { name = "pytest-cov" }, { name = "ruff" }]

