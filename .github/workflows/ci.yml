name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: finance, POSTGRES_PASSWORD: finance, POSTGRES_DB: finance}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U finance" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest
      - run: uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head
        env: {DATABASE_URL: "postgresql+psycopg://finance:finance@localhost:5432/finance", CORE_API_KEY: test-secret, TELEGRAM_WEBHOOK_SECRET: test-secret}
      - run: docker build .
