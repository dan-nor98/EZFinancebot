[project]
name = "ezfinancebot"
version = "0.1.0"
description = "Deterministic Persian-first personal finance core"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "httpx>=0.28",
  "jdatetime>=5.2",
  "pydantic-settings>=2.7",
  "psycopg[binary]>=3.2",
  "python-json-logger>=3.2",
  "sqlalchemy>=2.0",
  "uvicorn>=0.34",
]

[dependency-groups]
dev = ["mypy>=1.14", "pytest>=8.3", "pytest-cov>=6", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["finance", "apps"]
mypy_path = ["src", "."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
